name: taghyeer_app
description: Taghyeer Technologies - Flutter Technical Assignment
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.2

  # Local Storage
  shared_preferences: ^2.2.2

  # Internet Connectivity
  connectivity_plus: ^5.0.2

  # Functional Programming (Either type)
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^7.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
